<!DOCTYPE html>
<html>
<head>
    <title>极简React原理 - 第一步</title>
</head>
<body>
    <div id="root"></div>

    <script>
        // ----- 1. 保存当前状态 -----
        let state = {
            count: 0
        };

        // ----- 2. 定义UI（就像React组件的render）-----
        function render() {
            const app = document.getElementById('root');
            
            // 清空容器（简单粗暴，模拟diff前的清除）
            app.innerHTML = '';
            
            // 创建DOM元素来表达当前状态
            const div = document.createElement('div');
            div.textContent = `Count: ${state.count}`;
            
            const button = document.createElement('button');
            button.textContent = 'Increment';
            button.onclick = () => {
                // 改变状态
                state.count++;
                // 重新执行渲染（模拟React的重新渲染流程）
                render();
            };
            
            div.appendChild(button);
            app.appendChild(div);
        }

        // 启动渲染
        render();
    </script>
</body>
</html>
